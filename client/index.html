<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2033" />
    <meta
      name="description"
      content="Free browser-based tools for electrical engineering students: an Ohm's law calculator, a waveform visualiser, and a logic gate sandbox."
    />
    <title>EERoom - Free Browser-Based EE Simulation Tools</title>

    <!--
      IBM Plex Sans and IBM Plex Mono, loaded from Google Fonts.
      preconnect shortens the handshake before the stylesheet request;
      display=swap shows fallback text immediately instead of leaving a
      blank page while the fonts download.
      Source: the link tags Google Fonts generates for a font selection -
      https://developers.google.com/fonts/docs/getting_started
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
